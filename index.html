<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="img-container">
        <div class="logo-div">
            <img src="img/odin-lined.png" alt="">
            <p>MOVIE-ODIN</p>
        </div>
    </div>

    <div class="content-container">
        <div class="introduction-text">
            <p>eA0^@</p>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ab sequi, a ipsum id non voluptatum nisi eum fugit eligendi dolorem, corporis alias quis! Optio sed porro earum officiis enim obcaecati.</p>
        </div>

        <div class="form-section">
            <form action="https://pwk-odin-movie.com/register" method="post">
                <p>Register For your Pop Corns!</p> 
                <p><label for="first-name">First Name: </label>
                <input type="text" id="firstName" required></p>
                <p><label for="last-name">Last Name: 
                    <input type="text" id="last-name" required>
                </label></p>
                <p><label for="email">Email: </label>
                <input type="email" id="email" required></p>
                <p><label for="phone">Phone Number: </label>
                <input type="text" id="phone" required></p>
                <p><label for="password">Password:</label>
                <input type="password" id="password" required> </p>
                <p><label for="confirmation">Confirm Password:</label>
                <input type="password" label="confirmation" required></p>

                <div class="button">
                    <button type="submit">Create Account </button>
                </div>
            </form>
        </div>

        <div class="account-log-in">
            <p>Already have an account? Log in </p>
        </div>
    </div>
</body>
</html>
